; Plane Radar hardware targets:
;   supermini  — ESP32-C3 + 1.28" round GC9A01 (240×240)
;   crowpanel7 — Elecrow CrowPanel Basic 7" ESP32-S3 (800×480 + GT911)

[platformio]
boards_dir = boards

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
build_src_filter =
  +<*>
  -<crowpanel/>

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:crowpanel7]
platform = espressif32@6.5.0
board = crowpanel_7
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions/plane_radar.csv
build_src_filter =
  +<*>
  -<main.cpp>
  -<hardware/>
  -<ui/radar_display.cpp>
  -<ui/runway_overlay.cpp>
  -<ui/status_screens.cpp>
  ; The panel has its own aircraft feed client and airport table, in crowpanel/.
  -<services/adsb_client.cpp>
  -<data/large_airports_data.cpp>

build_flags =
  -std=gnu++17
  -DPLANE_RADAR_CROWPANEL=1
  -DCROWPANEL_HW_REV=3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  ; The USB-C port is a CH340 on UART0; GPIO 19/20 (native USB) carry touch I2C.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWM_NODEBUG
  -DWM_MDNS
  -DLV_CONF_SKIP
  -DLV_COLOR_DEPTH=16
  -DLV_COLOR_16_SWAP=0
  -DLV_FONT_MONTSERRAT_12=1
  -DLV_FONT_MONTSERRAT_14=1
  -DLV_FONT_MONTSERRAT_16=1
  -DLV_FONT_MONTSERRAT_18=1
  -DLV_FONT_MONTSERRAT_20=1
  -DLV_FONT_MONTSERRAT_24=1
  -DLV_FONT_MONTSERRAT_28=1
  -DLV_USE_PERF_MONITOR=0
  ; Dark dropdowns, switches and keyboard, to match the night-time UI.
  -DLV_THEME_DEFAULT_DARK=1
  ; "Find me" shows a QR code for a phone to scan.
  -DLV_USE_QRCODE=1
  ; LVGL's own memory pool. Its default 48 KB is not enough for this UI
  ; (about 45 KB is in use), and when the pool runs out LVGL stops dead. The
  ; "lcd" serial command reports how much is in use as lvgl_used; raise this
  ; if a new screen brings that near the limit. Errors are printed so that
  ; such a stop says why.
  -DLV_MEM_SIZE=65536
  -DLV_USE_LOG=1
  -DLV_LOG_LEVEL=LV_LOG_LEVEL_ERROR
  -DLV_LOG_PRINTF=1

lib_deps =
  lvgl/lvgl@8.4.0
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; The same firmware with the serial debug commands ("shot", "tap", "lcd" and
; the rest) that scripts/crowpanel_screenshot.py and crowpanel_record.py use.
; They let whoever holds the USB cable see and drive the screen, so they are
; not in the ordinary build.
[env:crowpanel7-debug]
extends = env:crowpanel7
build_flags =
  ${env:crowpanel7.build_flags}
  -DCROWPANEL_SERIAL_DEBUG=1
